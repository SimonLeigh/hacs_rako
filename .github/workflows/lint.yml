name: "Lint"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: "actions/setup-python@v7.0.0"
          with:
            python-version: "3.13"

        - name: "Install ruff"
          run: python3 -m pip install ruff==0.12.2

        - name: "Run"
          run: python3 -m ruff check .
