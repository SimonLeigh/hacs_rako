name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Stamp the release tag into manifest.json"
        shell: "bash"
        run: |
          jq --arg version "${{ github.event.release.tag_name }}" \
            '.version = $version' \
            "${{ github.workspace }}/custom_components/rako/manifest.json" \
            > "${{ github.workspace }}/custom_components/rako/manifest.json.tmp"
          mv "${{ github.workspace }}/custom_components/rako/manifest.json.tmp" \
            "${{ github.workspace }}/custom_components/rako/manifest.json"

      - name: "Validate manifest.json"
        shell: "bash"
        run: |
          MANIFEST="${{ github.workspace }}/custom_components/rako/manifest.json"

          # Must be valid JSON.
          jq empty "$MANIFEST"

          # The stamped version must match the release tag.
          STAMPED_VERSION="$(jq -r '.version' "$MANIFEST")"
          if [[ "$STAMPED_VERSION" != "${{ github.event.release.tag_name }}" ]]; then
            echo "::error::manifest.json version '$STAMPED_VERSION' does not match release tag '${{ github.event.release.tag_name }}'"
            exit 1
          fi

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/rako"
          zip rako.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: "softprops/action-gh-release@v3.0.3"
        with:
          files: "${{ github.workspace }}/custom_components/rako/rako.zip"
