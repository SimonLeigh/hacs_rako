# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

# The Phase-0 capture scripts are standalone diagnostics run by hand against a
# live bridge, not part of the shipped integration; the integration rules
# (annotations, docstrings, no print) are noise there.
extend-exclude = ["scripts/phase0"]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D213", # multi-line-summary-second-line (Home Assistant puts it on the first)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter

    # Selecting ALL brings in rules Home Assistant core does not select at all.
    # These are the ones that conflict with how an integration is written:
    "CPY001", # HA integrations carry no per-file copyright header
    "EM101", # exception messages are written inline, as in HA core
    "EM102",
    "TRY003", # ... and are long enough to be useful
    "RUF012", # `_attr_*` class attributes are the documented HA convention
    "ARG001", # entity/platform function signatures are dictated by HA, not by us
    "ARG002",
    "ARG004",
]

[lint.per-file-ignores]
# WP-2.4: the test suite follows pytest conventions the main config
# deliberately doesn't relax (main-config comment above explains that
# approach) -- `assert` *is* the assertion mechanism, fixtures are consumed
# for their side effects without being referenced, expected values are
# literal by nature, and test names are their own documentation.
"tests/**" = [
    "S101", # `assert` is how pytest tests assert
    "ANN", # test functions and fixtures are not a public API to annotate
    "D1", # test names document intent; docstrings are only added where they add something
    "D401", # ditto for imperative-mood summaries
    "PLR2004", # expected values are literal on purpose
    "PLR0913", # fixture-heavy signatures are normal in pytest
    "PLR0917",
    "ARG001", # fixtures are frequently consumed only for their side effects
    "ARG005",
    "PLC0415", # a handful of tests import a fake/module only where it's used
    "FBT001", # tests/fakes.py mirrors python_rako's own boolean-kwarg call signatures
    "FBT002",
    "E501", # long assertions/docstrings quoting BRIDGE_BEHAVIOUR.md read better unwrapped
    "SLF001", # exercising buffering/ordering directly against coordinator internals
              # (e.g. the pre-first-snapshot broadcast test) needs this, deliberately
]

[lint.isort]
# Matches Home Assistant core: `homeassistant` is first-party, so library
# imports (python_rako) sort ahead of it.
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
